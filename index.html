<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GymLog — Entrenamientos</title>
<style>
:root{
 --bg:#f3f5f8;--card:#ffffff;--text:#101318;--muted:#7d8490;--line:#e6e9ee;
 --accent:#6257f4;--accent-soft:#eeecff;--green:#15945b;--red:#d83b55;
 --shadow:0 12px 34px rgba(22,25,35,.07);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#e9ebef}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
button,input,select{font:inherit}
button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{width:min(100%,500px);min-height:100vh;margin:auto;background:var(--bg);padding-bottom:92px}
header{padding:22px 18px 12px;position:sticky;top:0;z-index:10;background:rgba(243,245,248,.92);backdrop-filter:blur(16px)}
header h1{font-size:28px;line-height:1;margin:0 0 5px;font-weight:850;letter-spacing:-.7px}
header .sub{font-size:13px;color:var(--muted)}
main{padding:6px 14px}
.screen{display:none}.screen.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin:10px 0;box-shadow:var(--shadow)}
h2{font-size:20px;line-height:1.15;margin:5px 0 15px;letter-spacing:-.25px}
h3{font-size:15px;margin:0 0 9px}
.sub{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.45px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button.primary,button:not(.secondary):not(.danger):not(.x){background:var(--accent);color:#fff;font-weight:800;border-radius:13px;padding:12px 14px;box-shadow:0 5px 14px rgba(98,87,244,.2)}
button.secondary{background:#eef0f4;color:#343942;border-radius:13px;padding:11px 14px;font-weight:750}
button.danger{background:#fff0f2;color:var(--red);border-radius:12px;padding:9px 11px;font-weight:750}
button.small{font-size:12px;padding:8px 10px}
input,select{width:100%;border:1px solid #dfe3e9;background:#fff;border-radius:12px;padding:12px;color:var(--text);outline:0}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* Workout */
.workout-top{position:relative}
.workout-title{font-size:24px;font-weight:850;letter-spacing:-.5px}
.progressbar{height:5px;background:#e7e8ed;border-radius:99px;overflow:hidden;margin-top:12px}
.progressbar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.exercise-card{padding:14px 13px}
.exercise-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.exercise-name{font-size:17px;font-weight:850}
.last{font-size:11px;color:#9aa0aa;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
.series-head{display:grid;grid-template-columns:34px 1fr 1fr 35px;gap:7px;color:#a0a5ae;font-size:10px;font-weight:800;text-transform:uppercase;margin:0 0 4px;text-align:center}
.series-row{display:grid;grid-template-columns:34px 1fr 1fr 35px;gap:7px;align-items:center;margin:7px 0}
.series-row .num{font-weight:800;color:#9da2ac;text-align:center}
.series-row input{font-size:22px;font-weight:850;padding:10px;text-align:center;height:49px}
.series-row .x{background:#f0f1f4;color:#8b9099;border-radius:11px;height:49px;font-size:19px}
.series-vol{font-size:11px;color:var(--muted);text-align:right;margin:4px 2px 9px}
.quickbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quickbar button{min-height:43px}
.session-footer{position:sticky;bottom:74px;z-index:8;background:rgba(243,245,248,.94);backdrop-filter:blur(14px);padding:8px 0}
.session-footer-inner{background:#16181e;color:#fff;border-radius:17px;padding:11px 13px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 25px #0002}
.session-footer .total{font-size:22px;font-weight:900}
.session-footer .label{font-size:9px;color:#aeb2bb;text-transform:uppercase;letter-spacing:.5px}
/* Routine cards */
.routine-card .routine-name{font-size:18px;font-weight:850}
.tag{display:inline-flex;align-items:center;gap:5px;background:#f0f1f5;border-radius:999px;padding:7px 9px;margin:3px 3px 0 0;font-size:12px;font-weight:650}
.tag button{padding:0;background:transparent;color:#777;font-size:16px}
/* Metrics */
.big{font-size:34px;font-weight:900;letter-spacing:-1.5px}.total{font-size:31px;font-weight:900}
.metric{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.up{color:var(--green);font-weight:850;font-size:13px}
.chart{height:195px;position:relative;margin-top:4px}.chart svg{width:100%;height:100%;overflow:visible}
.chart .axis{stroke:#e4e6eb;stroke-width:1}.chart .line{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.chart .dot{fill:#fff;stroke:var(--accent);stroke-width:3}
.chart text{font-size:10px;fill:#8c929c;font-weight:650}
.legend{font-size:12px;color:#777e89;line-height:1.45;background:#f7f8fa;border-radius:12px;padding:9px}
/* Calendar */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead{text-align:center;color:#999;font-size:10px;font-weight:800;padding:4px}
.day{aspect-ratio:1;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:650}
.day.work{background:var(--accent);color:#fff;font-weight:900;box-shadow:0 4px 10px #6257f433}.day.today{outline:2px solid #b9bcc5}.day.empty{visibility:hidden}
.session-mini{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:11px 0;font-size:13px}.session-mini:last-child{border:0}
.empty{text-align:center;color:var(--muted);padding:25px 8px;font-size:13px}
.note{background:#fff8dc;border:1px solid #f0dfa0;border-radius:12px;padding:10px;font-size:12px;color:#695a22}
/* Navigation */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,500px);height:76px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -8px 25px #00000008}
nav button{background:transparent;color:#9398a2;border-radius:0;padding:7px 2px;font-size:9px;font-weight:650;flex:1;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
nav button.active{color:var(--accent);font-weight:850}.ico{font-size:21px;line-height:20px}
/* Modal */
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:50}.modal.open{display:flex}
.sheet{background:#fff;width:min(100%,500px);margin:auto 0 0;padding:18px;border-radius:24px 24px 0 0;max-height:88vh;overflow:auto}
.sheet h2{margin-top:0}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}
.exercise-picker{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.exercise-picker button{background:#f0f1f5;color:#30343b;border-radius:999px;padding:9px 11px}
.exercise-picker button.sel{background:var(--accent);color:#fff}
.toast{position:fixed;bottom:91px;left:50%;transform:translateX(-50%);background:#17191d;color:#fff;padding:11px 15px;border-radius:13px;display:none;z-index:80;font-size:13px;font-weight:700;box-shadow:0 8px 25px #0003}
@media(max-width:360px){.series-row,.series-head{grid-template-columns:28px 1fr 1fr 31px}.series-row input{font-size:19px}.last{max-width:185px}}
</style>

<script>
const KEY="gymlog_v1";
const exampleRoutines=[
{id:1,name:"Tren inferior",exercises:["Sentadilla","Prensa de piernas","Curl femoral","Hip thrust"]},
{id:2,name:"Empuje",exercises:["Press banca","Press inclinado","Aperturas con mancuernas","Extensión de tríceps","Press de hombros"]},

];

let state=load(), currentTab="registrar", editingRoutine=null, sessionDraft=null, calDate=new Date();

function load(){
 let x=localStorage.getItem(KEY); if(x){let data=JSON.parse(x);if(!data.version){const rs=data.routines||[],ss=data.sessions||[];const legacy=ss.length===12&&rs.length===3&&rs.every((r,i)=>r.id===exampleRoutines[i].id&&r.name===exampleRoutines[i].name&&JSON.stringify(r.exercises)===JSON.stringify(exampleRoutines[i].exercises));if(legacy)ss.forEach(s=>s.demo=true);data.version=2;localStorage.setItem(KEY,JSON.stringify(data));}return data;}

 "Curl femoral":[35,35,40,40,42.5,42.5,45,45,47.5,47.5,50,50],

 for(let i=0;i<12;i++){
  let d=new Date(now); d.setDate(d.getDate()-(58-i*5));
  let pool=i%3===0?exampleRoutines[0]:i%3===1?exampleRoutines[1]:exampleRoutines[2];
  sessions.push({id:Date.now()+i,demo:true,date:d.toISOString().slice(0,10),routine:pool.name,sets:pool.exercises.map((e,j)=>({exercise:e,sets:[{w:(setsBy[e]||[20])[i],r:10},{w:(setsBy[e]||[20])[i],r:9}]}))});
 }
 return {version:2,routines:exampleRoutines.map(r=>({...r,demo:true})),sessions};
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(n){return new Intl.NumberFormat("es-CO",{maximumFractionDigits:1}).format(n)}
function dateFmt(s){return new Date(s+"T12:00:00").toLocaleDateString("es-CO",{day:"2-digit",month:"short"})}
function volSession(s){return s.sets.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+(+x.w||0)*(+x.r||0),0),0)}
function lastFor(ex, before=null){let ss=state.sessions.filter(s=>(!before||s.date<before)&&s.sets.some(e=>e.exercise===ex)).sort((a,b)=>b.date.localeCompare(a.date));let e=ss[0]?.sets.find(x=>x.exercise===ex);return e?.sets?.length?e.sets.map(x=>`${x.w}×${x.r}`).join(" · "):"—"}
function openModal(html){sheet.innerHTML=html;modal.classList.add("open")}
function closeModal(){modal.classList.remove("open")}
modal.onclick=e=>{if(e.target===modal)closeModal()}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function showTab(t){currentTab=t;document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("active",x.id===t));document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.tab===t));document.getElementById("title").textContent={registrar:"Registrar",rutinas:"Rutinas",progreso:"Progreso",calendario:"Calendario",resumen:"Resumen"}[t];render()}
function render(){if(currentTab==="registrar")renderRegistrar();if(currentTab==="rutinas")renderRoutines();if(currentTab==="progreso")renderProgress();if(currentTab==="calendario")renderCalendar();if(currentTab==="resumen")renderSummary()}

function renderRegistrar(){
 let el=document.getElementById("registrar");
 if(!sessionDraft){
  el.innerHTML=`<div class="hero"><div class="section-label" style="color:#b6baaf">HOY</div><div class="hero-title">Entrena. Registra.<br><span>Mejora.</span></div><p>Todo tu progreso, sin perder tiempo entre series.</p><div class="hero-stats"><div><b>${state.sessions.length}</b><small>sesiones</small></div><div><b>${fmt(state.sessions.reduce((a,s)=>a+volSession(s),0))}</b><small>kg totales</small></div><div><b>${state.routines.length}</b><small>rutinas</small></div></div></div><div class="section-label">EMPEZAR ENTRENAMIENTO</div><div class="card start-card"><h2>¿Qué vas a entrenar?</h2><div class="routine-grid">${state.routines.map((r,i)=>{let icons=["↘","↗","↔","◈","◆"];return `<button class="routine-launch" onclick="startSession(${r.id})"><span class="launch-icon">${icons[i%icons.length]}</span><span class="launch-name">${esc(r.name)||"Sin nombre"}</span><span class="launch-meta"><span>${r.exercises.length} ejercicios</span><b>→</b></span></button>`}).join("")}</div><button class="free-launch" onclick="startFree()"><span>＋</span><div><b>Sesión libre</b><small>Elige tus ejercicios al empezar</small></div><strong>→</strong></button></div>
  <div class="card"><div class="between row"><h3>Últimas sesiones</h3><span class="sub">${state.sessions.length} SESIONES</span></div>${state.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(s=>`<div class="session-mini"><span>${dateFmt(s.date)} · ${esc(s.routine||"Libre")}</span><b>${fmt(volSession(s))} kg</b><button class="icon-delete" onclick="deleteSession(${s.id})">×</button></div>`).join("")}</div>`;
  return;
 }
 let done=sessionDraft.sets.filter(e=>e.exercise).length;
 el.innerHTML=`<div class="card workout-top"><div class="row between"><div><div class="sub">ENTRENAMIENTO</div><div class="workout-title">${esc(sessionDraft.routine)}</div><div class="sub" style="margin-top:3px">${sessionDraft.date}</div></div><button class="secondary small" onclick="cancelSession()">Cancelar</button></div><div class="progressbar"><span style="width:${sessionDraft.sets.length?done/sessionDraft.sets.length*100:0}%"></span></div></div>
 ${sessionDraft.sets.map((e,i)=>exerciseEditor(e,i)).join("")}
 <div class="card"><button class="secondary" style="width:100%" onclick="openFreePicker()">＋ Agregar otro ejercicio</button></div>
 <div class="session-footer"><div class="session-footer-inner"><div><div class="label">Volumen</div><div class="total">${fmt(draftVol())} kg</div></div><button onclick="finishSession()">✓ Guardar</button></div></div>`;
}
function exerciseEditor(e,i){
 let total=e.sets.reduce((a,x)=>a+(+x.w||0)*(+x.r||0),0), last=lastFor(e.exercise,sessionDraft.date);
 return `<div class="card exercise-card"><div class="exercise-head"><div><div class="exercise-name">${esc(e.exercise||"Ejercicio")}</div><div class="last">Última vez: ${esc(last)}</div></div><span class="sub">${fmt(total)} KG</span></div>
 <div class="series-head"><span>#</span><span>KG</span><span>REPS</span><span></span></div>
 ${e.sets.map((x,j)=>`<div class="series-row"><span class="num">${j+1}</span><input id="w_${i}_${j}" inputmode="decimal" type="number" step=".5" placeholder="0" value="${x.w??""}" onchange="updSet(${i},${j},'w',this.value)" onkeydown="quickKey(event,${i},${j},'w')"><input id="r_${i}_${j}" inputmode="numeric" type="number" placeholder="0" value="${x.r??""}" onchange="updSet(${i},${j},'r',this.value)" onkeydown="quickKey(event,${i},${j},'r')"><button class="x" onclick="delSet(${i},${j})">×</button></div>`).join("")}
 <div class="series-vol">Volumen: <b>${fmt(total)} kg</b></div>
 <div class="quickbar"><button class="secondary small" onclick="repeatLast(${i})">↻ Repetir última</button><button class="secondary small" onclick="addSet(${i})">＋ Siguiente serie</button></div></div>`
}
function quickKey(ev,i,j,type){
 if(ev.key!=="Enter" && ev.key!=="Tab")return;
 ev.preventDefault();
 if(type==="w"){document.getElementById(`r_${i}_${j}`)?.focus()}
 else { if(j===sessionDraft.sets[i].sets.length-1) addSet(i); setTimeout(()=>document.getElementById(`w_${i}_${j+1}`)?.focus(),30)}
}
function repeatLast(i){
 let e=sessionDraft.sets[i], last=e.sets[e.sets.length-1]||{w:"",r:""};
 e.sets.push({w:last.w,r:last.r});render();setTimeout(()=>document.getElementById(`w_${i}_${e.sets.length-1}`)?.focus(),30)
}
function startSession(id){let r=state.routines.find(x=>x.id===id);sessionDraft={date:new Date().toISOString().slice(0,10),routine:r.name,sets:r.exercises.map(e=>({exercise:e,sets:[{w:"",r:""}]}))};render()}
function startFree(){sessionDraft={date:new Date().toISOString().slice(0,10),routine:"Sesión libre",sets:[]};openFreePicker()}
function openFreePicker(){openModal(`<h2>Agregar ejercicio</h2><input id="newEx" placeholder="Busca o escribe un ejercicio"><div class="exercise-picker">${exPool.map(e=>`<button onclick="chooseFree('${esc(e)}')">${esc(e)}</button>`).join("")}</div><div class="actions"><button class="secondary" onclick="closeModal()">Cerrar</button><button onclick="chooseCustomFree()">Usar escrito</button></div>`)}
function chooseCustomFree(){let v=document.getElementById("newEx").value.trim();if(v)chooseFree(v);else toast("Escribe un ejercicio");}
function chooseFree(e){sessionDraft.sets.push({exercise:e,sets:[{w:"",r:""}]});closeModal();render();setTimeout(()=>document.getElementById(`w_${sessionDraft.sets.length-1}_0`)?.focus(),80)}
function addSet(i){sessionDraft.sets[i].sets.push({w:"",r:""});render()}
function delSet(i,j){sessionDraft.sets[i].sets.splice(j,1);if(!sessionDraft.sets[i].sets.length)sessionDraft.sets[i].sets.push({w:"",r:""});render()}
function updSet(i,j,k,v){sessionDraft.sets[i].sets[j][k]=v}
function draftVol(){return sessionDraft.sets.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+(+x.w||0)*(+x.r||0),0),0)}
function finishSession(){let s={...sessionDraft,id:Date.now(),demo:false};s.sets=s.sets.filter(e=>e.exercise&&e.sets.some(x=>+x.w&&+x.r));if(!s.sets.length)return toast("Agrega al menos una serie válida");state.sessions.push(s);save();sessionDraft=null;toast("Sesión guardada");render()}
function cancelSession(){if(confirm("¿Cancelar esta sesión?")){sessionDraft=null;render()}}

function renderRoutines(){document.getElementById("rutinas").innerHTML=`<div class="top-action"><div><div class="section-label">TU PLAN</div><h2 class="page-heading">Rutinas</h2></div><button class="add-round" onclick="newRoutine()">＋</button></div><div class="routine-stack">${state.routines.map((r,i)=>`<div class="routine-card"><div class="routine-card-top"><div class="routine-mark">${["↘","↗","↔","◈","◆"][i%5]}</div><div class="routine-main"><h3>${esc(r.name)||"Sin nombre"}</h3><span>${r.exercises.length} ejercicios</span></div><button class="more-btn" onclick="editRoutine(${r.id})">Editar</button></div><div class="routine-tags">${r.exercises.map(e=>`<span class="tag">${esc(e)}</span>`).join("")}</div><button class="routine-start" onclick="startSession(${r.id})"><span>Comenzar rutina</span><b>→</b></button><button class="danger routine-delete" onclick="deleteRoutine(${r.id})">Eliminar rutina</button></div>`).join("")||`<div class="empty">Aún no tienes rutinas. Pulsa ＋ para crear la primera.</div>`}</div>`}
function newRoutine(){editingRoutine={id:null,name:"",exercises:[]};routineModal()}
function editRoutine(id){editingRoutine=JSON.parse(JSON.stringify(state.routines.find(r=>r.id===id)));routineModal()}
function routineModal(){
 let r=editingRoutine;
 openModal(`<h2>${r.id?"Editar":"Nueva"} rutina</h2>
 <label class="sub">Nombre</label>
 <input id="rname" value="${esc(r.name||"")}" placeholder="Ej. Pecho y tríceps" oninput="editingRoutine.name=this.value">
 <h3 style="margin-top:16px">Ejercicios</h3>
 <div>${r.exercises.map((e,i)=>`<span class="tag">${esc(e)} <button onclick="editingRoutine.exercises.splice(${i},1);routineModal()">×</button></span>`).join("")||`<div class="empty" style="padding:12px 0;text-align:left">Aún no has añadido ejercicios.</div>`}</div>
 <input id="addEx" list="exlist" placeholder="Agregar ejercicio" onkeydown="if(event.key==='Enter'){event.preventDefault();addRoutineEx()}">
 <datalist id="exlist">${exPool.map(e=>`<option value="${esc(e)}">`).join("")}</datalist>
 <button class="secondary" style="width:100%;margin-top:7px" onclick="addRoutineEx()">＋ Agregar ejercicio</button>
 <div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button onclick="saveRoutine()">Guardar rutina</button></div>`)
}
function addRoutineEx(){
 let nameInput=document.getElementById("rname");
 if(nameInput) editingRoutine.name=nameInput.value;
 let input=document.getElementById("addEx"),v=input?input.value.trim():"";
 if(v&&!editingRoutine.exercises.includes(v)) editingRoutine.exercises.push(v);
 routineModal();
}
function saveRoutine(){
 let nameInput=document.getElementById("rname");
 let n=(nameInput?nameInput.value:editingRoutine.name||"").trim();
 editingRoutine.name=n;
 if(!n)return toast("Ponle un nombre a la rutina");
 if(!editingRoutine.exercises.length)return toast("Agrega al menos un ejercicio");
 if(editingRoutine.id){
   let i=state.routines.findIndex(r=>r.id===editingRoutine.id);
   if(i>=0) state.routines[i]={...editingRoutine,name:n};
 }else state.routines.push({...editingRoutine,id:Date.now(),demo:false,name:n});
 save();closeModal();render();toast("Rutina guardada");
}
function deleteRoutine(id){if(confirm("¿Borrar esta rutina?")){state.routines=state.routines.filter(r=>r.id!==id);save();render()}}

function exerciseHistory(ex){return state.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(s=>{let e=s.sets.find(x=>x.exercise===ex);if(!e)return null;return {date:s.date,max:Math.max(...e.sets.map(x=>+x.w||0)),vol:e.sets.reduce((a,x)=>a+(+x.w||0)*(+x.r||0),0)}}).filter(Boolean)}
function renderProgress(){let all=[...new Set(state.sessions.flatMap(s=>s.sets.map(e=>e.exercise)))].sort(), selected=document.getElementById("progEx")?.value||all[0]||"";let h=exerciseHistory(selected), first=h[0], last=h[h.length-1], rise=first&&last?last.max-first.max:0, pct=first&&first.max?rise/first.max*100:0, vrise=first&&last?last.vol-first.vol:0;
 document.getElementById("progreso").innerHTML=`<div class="card"><label class="sub">EJERCICIO</label><select id="progEx" onchange="renderProgress()">${all.map(e=>`<option ${e===selected?"selected":""}>${esc(e)}</option>`).join("")}</select></div>
 ${selected?`<div class="card"><div class="metric"><div><div class="sub">PESO MÁXIMO ACTUAL</div><div class="big">${fmt(last.max)} kg</div></div><div class="up">+${fmt(rise)} kg · ${pct>=0?"+":""}${fmt(pct)}%</div></div><div class="chart">${lineChart(h,"max")}</div><div class="legend">Este gráfico muestra el peso más alto que usaste en cada sesión. Si sube, estás ganando fuerza en ese ejercicio.</div></div>
 <div class="card"><div class="metric"><div><div class="sub">VOLUMEN ACTUAL</div><div class="big">${fmt(last.vol)} kg</div></div><div class="up">+${fmt(vrise)} kg</div></div><div class="chart">${lineChart(h,"vol")}</div><div class="legend">Este gráfico muestra todo el trabajo acumulado del ejercicio en cada sesión: peso × repeticiones.</div></div>`:"<div class='empty'>Todavía no hay datos de ejercicios.</div>"}`}
function lineChart(data,key){if(!data.length)return"";let W=440,H=180,p=24,vals=data.map(x=>x[key]),min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}let pts=vals.map((v,i)=>{let x=p+i*(W-2*p)/Math.max(1,vals.length-1),y=H-p-(v-min)/(max-min)*(H-2*p);return [x,y,v]});let path=pts.map((a,i)=>(i?"L":"M")+a[0].toFixed(1)+" "+a[1].toFixed(1)).join(" ");return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line class="axis" x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/><line class="axis" x1="${p}" y1="${p}" x2="${p}" y2="${H-p}"/><path class="line" d="${path}"/>${pts.map(a=>`<circle class="dot" cx="${a[0]}" cy="${a[1]}" r="4"/><text x="${a[0]}" y="${a[1]-8}" text-anchor="middle">${fmt(a[2])}</text>`).join("")}</svg>`}

function renderCalendar(){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7, names=["L","M","X","J","V","S","D"], trained=new Set(state.sessions.filter(s=>{let d=new Date(s.date+"T12:00:00");return d.getFullYear()===y&&d.getMonth()===m}).map(s=>+s.date.slice(8)));
 let cells=names.map(n=>`<div class="calhead">${n}</div>`).join("");for(let i=0;i<start;i++)cells+="<div class='day empty'></div>";for(let d=1;d<=days;d++){let today=new Date(),isToday=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;cells+=`<div class="day ${trained.has(d)?"work":""} ${isToday?"today":""}">${d}</div>`}
 document.getElementById("calendario").innerHTML=`<div class="calendar-card"><div class="calendar-top"><button class="cal-arrow" onclick="moveCal(-1)" aria-label="Mes anterior">‹</button><div style="text-align:center"><div class="section-label" style="margin:0">CALENDARIO</div><h2 style="margin:3px 0 0;text-transform:capitalize">${first.toLocaleDateString("es-CO",{month:"long",year:"numeric"})}</h2></div><button class="cal-arrow" onclick="moveCal(1)" aria-label="Mes siguiente">›</button></div><div class="calendar">${cells}</div><div class="calendar-legend"><span></span> Día entrenado</div></div><div class="card"><h3>Sesiones del mes</h3>${state.sessions.filter(s=>{let d=new Date(s.date+"T12:00:00");return d.getFullYear()===y&&d.getMonth()===m}).sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<div class="session-mini"><span>${dateFmt(s.date)} · ${esc(s.routine||"Libre")}</span><b>${fmt(volSession(s))} kg</b></div>`).join("")||"<div class='empty'>No entrenaste este mes.</div>"}</div>`}
function moveCal(n){calDate.setMonth(calDate.getMonth()+n);renderCalendar()}

function renderSummary(){let total=state.sessions.reduce((a,s)=>a+volSession(s),0), gains=[];let exs=[...new Set(state.sessions.flatMap(s=>s.sets.map(e=>e.exercise)))];exs.forEach(ex=>{let h=exerciseHistory(ex);if(h.length>1)gains.push({ex,g:h[h.length-1].max-h[0].max})});gains.sort((a,b)=>b.g-a.g);
 document.getElementById("resumen").innerHTML=`<div class="grid2"><div class="card"><div class="sub">SESIONES</div><div class="big">${state.sessions.length}</div></div><div class="card"><div class="sub">VOLUMEN TOTAL</div><div class="big">${fmt(total)}</div><div class="sub">kg levantados</div></div></div><div class="card"><h2>Donde más subiste</h2>${gains.slice(0,10).map((x,i)=>`<div class="session-mini"><span>${i+1}. ${esc(x.ex)}</span><b class="${x.g>0?"up":""}">${x.g>=0?"+":""}${fmt(x.g)} kg</b></div>`).join("")||"<div class='empty'>Necesitas al menos dos registros por ejercicio.</div>"}</div>
 <div class="card"><h3>Datos</h3><div class="actions"><button onclick="exportJSON()">Exportar JSON</button><button class="secondary" onclick="document.getElementById('importFile').click()">Importar JSON</button></div><div class="note">El archivo JSON contiene tus rutinas y sesiones. Puedes guardarlo como respaldo y volver a cargarlo en este dispositivo.</div></div>
 <div class="card"><button class="danger" style="width:100%" onclick="resetData()">Borrar datos de ejemplo</button></div>`}
function exportJSON(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gymlog-backup.json";a.click();URL.revokeObjectURL(a.href)}
document.getElementById("importFile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.routines||!x.sessions)throw 0;state=x;save();render();toast("Datos importados")}catch{alert("Ese archivo no parece un respaldo válido de GymLog.")}};r.readAsText(f);e.target.value=""}
function resetData(){const ds=state.sessions.filter(s=>s.demo).length,dr=state.routines.filter(r=>r.demo).length;if(!ds&&!dr)return toast("No quedan datos de ejemplo");if(confirm(`¿Borrar los datos de ejemplo? Se eliminarán ${ds} sesiones y ${dr} rutinas de demostración. Tus registros reales se conservarán.`)){state.sessions=state.sessions.filter(s=>!s.demo);state.routines=state.routines.filter(r=>!r.demo);save();render();toast("Datos de ejemplo eliminados")}}
function deleteSession(id){if(confirm("¿Borrar esta sesión? Esta acción no se puede deshacer.")){state.sessions=state.sessions.filter(s=>s.id!==id);save();render();toast("Sesión eliminada")}}
render();
</script>
</body>
